[package]
name = "klipp"
version = "0.4.0"
edition = "2024"
description = "Desktop soundboard with a quick overlay and virtual microphone routing."
license = "GPL-3.0-only"
authors = ["Ernesto Muniz"]
repository = "https://github.com/ErnestoMuniz/klipp"
homepage = "https://github.com/ErnestoMuniz/klipp"
rust-version = "1.85"

[dependencies]
open-gpui = "0.2"
open-gpui-platform = { version = "0.2", features = ["wayland", "x11", "font-kit"] }
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
symphonia = { version = "0.5", default-features = false, features = ["all"] }
libpulse-simple-sys = "1.22"
libpulse-sys = "1.23"
libpulse-binding = "2.30"
# freetype do sistema no ubuntu-22.04 (CI) é velho demais para o
# freetype-sys: compila o vendored (unifica feature no build todo).
freetype-sys = { version = "0.23", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
futures-util = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = "0.25"
smallvec = "1"
notify = "8"
gpui-animation = { path = "vendor/gpui-animation" }
ureq = { version = "2", features = ["json"] }
mouse-coords = "0.2"
cosmic-text = "0.19"
swash = "0.2"
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }

[profile.dev]
opt-level = 1

[dev-dependencies]
async-io = "2"
