[package]
name = "klipp"
version = "0.1.0"
edition = "2024"

[dependencies]
open-gpui = "0.2"
open-gpui-platform = { version = "0.2", features = ["wayland", "x11", "font-kit"] }
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
symphonia = { version = "0.5", default-features = false, features = ["all"] }
libpulse-simple-sys = "1.4"
libpulse-sys = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
futures-util = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = "0.25"
smallvec = "1"
notify = "8"
gpui-animation = { path = "vendor/gpui-animation" }
ureq = { version = "2", features = ["json"] }
mouse-coords = { path = "../../mouse-coords" }
cosmic-text = "0.19"
swash = "0.2"
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }

[profile.dev]
opt-level = 1
