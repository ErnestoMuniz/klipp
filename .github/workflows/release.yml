name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Deps do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libpulse-dev \
            libfontconfig-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libdbus-1-dev \
            zsync

      - name: appimagetool (sem FUSE, via extract)
        run: |
          curl -sSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && /tmp/appimagetool.AppImage --appimage-extract >/dev/null)
          echo "APPIMAGETOOL=/tmp/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Testes
        run: cargo test

      - name: Monta o AppImage
        run: ./packaging/appimage/build.sh

      - name: Publica no Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packaging/Klipp-*-x86_64.AppImage
            packaging/Klipp-*-x86_64.AppImage.zsync
