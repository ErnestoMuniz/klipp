app-id: io.github.ErnestoMuniz.Klipp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: klipp
finish-args:
  - --share=network      # browse/preview/download myinstants.com
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio   # playback + pactl (PipeWire/Pulse)
  - --device=dri          # wgpu
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  - --talk-name=org.kde.StatusNotifierWatcher
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
modules:
  - name: klipp
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/klipp/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --manifest-path Cargo.toml
      - install -Dm0755 target/release/klipp ${FLATPAK_DEST}/bin/klipp
      - install -Dm0644 packaging/io.github.ErnestoMuniz.Klipp.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm0644 packaging/io.github.ErnestoMuniz.Klipp.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm0644 assets/fonts/NotoColorEmoji.ttf ${FLATPAK_DEST}/share/klipp/fonts/NotoColorEmoji.ttf
      - for s in 16 32 48 64 128 256 512; do install -Dm0644 packaging/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png; done
    sources:
      - type: dir
        path: ..
      - cargo-sources.json
